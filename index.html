<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0B0B0F">
<title>互動拍照</title>
<link rel="stylesheet" href="./style.css">
<script defer src="./effects.js"></script>
<script defer src="./app.js"></script>
</head>
<body>

<div id="app">

  <canvas id="stage"></canvas>
  <video id="source" playsinline muted autoplay></video>

  <section class="screen is-active" id="screenIntro">
    <div class="panel">
      <h1 class="panel__title" id="introTitle">互動拍照</h1>
      <p class="panel__desc">
        選擇喜歡的動畫夥伴，拍下屬於你的合影。<br>
        照片只在此裝置上合成，不會上傳。
      </p>
      <button class="btn btn--primary" id="btnStart">開始拍照</button>
      <p class="panel__note">按下後瀏覽器會詢問相機權限</p>
    </div>
  </section>

  <section class="screen" id="screenCamera">
    <header class="topbar">
      <span class="topbar__title" id="barTitle"></span>
    </header>

    <div class="countdown" id="countdown" aria-hidden="true"></div>
    <div class="flash" id="flash" aria-hidden="true"></div>

    <footer class="controls">
      <div class="pickers" id="pickers">
        <div class="picker">
          <span class="picker__label">圖片</span>
          <div class="chips" id="spriteChips" role="tablist" aria-label="圖片素材"></div>
        </div>
        <div class="picker">
          <span class="picker__label">動作</span>
          <div class="chips" id="motionChips" role="tablist" aria-label="動作方式"></div>
        </div>
      </div>

      <div class="pickerbar">
        <button class="picker-toggle" id="btnPickers" aria-expanded="false" aria-controls="pickers">
          <span class="picker-toggle__ico" aria-hidden="true"></span>
          <span id="pickerSummary">更換</span>
        </button>
      </div>
      <div class="shutterbar">
        <button class="iconbtn iconbtn--frame" id="btnFrame" aria-pressed="true">
          <span class="iconbtn__ico" aria-hidden="true"></span>
          <span class="iconbtn__label">相框</span>
        </button>
        <button class="shutter" id="btnShutter" aria-label="拍照"><span></span></button>
        <button class="iconbtn iconbtn--flip" id="btnFlip">
          <span class="iconbtn__ico" aria-hidden="true"></span>
          <span class="iconbtn__label">鏡頭</span>
        </button>
      </div>
    </footer>
  </section>

  <section class="screen" id="screenResult">
    <div class="result">
      <div class="result__frame"><img id="resultImg" alt="拍攝結果"></div>
      <p class="result__hint" id="resultHint"></p>
      <div class="result__actions">
        <button class="btn btn--ghost" id="btnRetake">重新拍攝</button>
        <button class="btn btn--primary" id="btnSave">儲存照片</button>
      </div>
    </div>
  </section>

  <section class="screen" id="screenError">
    <div class="panel">
      <h2 class="panel__title panel__title--sm" id="errorTitle">無法啟動相機</h2>
      <p class="panel__desc" id="errorMsg"></p>
      <button class="btn btn--primary" id="btnRetry">重新嘗試</button>
    </div>
  </section>

</div>

</body>
</html>
