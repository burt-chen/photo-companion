<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0B0B0F">
<title>互動拍照</title>
<link rel="stylesheet" href="./style.css">
<script defer src="./effects.js"></script>
<script defer src="./app.js"></script>
</head>
<body>

<div id="app">

  <!-- 標題列：在照片區之外 -->
  <header class="topbar">
    <span class="topbar__title" id="barTitle"></span>
  </header>

  <!-- 照片區：相機畫面與動畫都畫在這裡，控制項不會覆蓋 -->
  <div class="stagewrap" id="stageWrap">
    <canvas id="stage"></canvas>
    <video id="source" playsinline muted autoplay></video>
    <div class="countdown" id="countdown" aria-hidden="true"></div>
    <div class="flash" id="flash" aria-hidden="true"></div>
  </div>

  <!-- 控制列：在照片區之外 -->
  <footer class="controls">
    <div class="pickers" id="pickersEffect">
      <div class="picker">
        <span class="picker__label">圖片</span>
        <div class="chips" id="spriteChips" role="tablist" aria-label="圖片素材"></div>
      </div>
      <div class="picker">
        <span class="picker__label">動作</span>
        <div class="chips" id="motionChips" role="tablist" aria-label="動作方式"></div>
      </div>
      <div class="picker">
        <span class="picker__label">大小</span>
        <div class="chips" id="sizeChips" role="tablist" aria-label="角色大小"></div>
      </div>
    </div>

    <div class="pickers pickers--frame" id="pickersFrame">
      <div class="picker">
        <span class="picker__label">相框</span>
        <div class="chips" id="frameChips" role="tablist" aria-label="相框樣式"></div>
      </div>
    </div>

    <div class="shutterbar">
      <div class="shutterbar__group">
        <button class="iconbtn iconbtn--effect" id="btnPickers" aria-expanded="false" aria-controls="pickersEffect">
          <span class="iconbtn__ico" aria-hidden="true"></span>
          <span class="iconbtn__label">效果</span>
        </button>
        <button class="iconbtn iconbtn--frame" id="btnFrame" aria-expanded="false" aria-controls="pickersFrame">
          <span class="iconbtn__ico" aria-hidden="true"></span>
          <span class="iconbtn__label">相框</span>
        </button>
      </div>

      <button class="shutter" id="btnShutter" aria-label="拍照"><span></span></button>

      <div class="shutterbar__group">
        <button class="iconbtn iconbtn--flip" id="btnFlip">
          <span class="iconbtn__ico" aria-hidden="true"></span>
          <span class="iconbtn__label">鏡頭</span>
        </button>
        <button class="iconbtn iconbtn--timer" id="btnTimer" aria-pressed="true">
          <span class="iconbtn__ico" aria-hidden="true"></span>
          <span class="iconbtn__label" id="timerLabel">3 秒</span>
        </button>
      </div>
    </div>
  </footer>

  <!-- 以下為覆蓋整個畫面的狀態頁 -->

  <section class="screen is-active" id="screenIntro">
    <div class="panel">
      <h1 class="panel__title" id="introTitle">互動拍照</h1>
      <p class="panel__desc">
        選擇喜歡的動畫夥伴，拍下屬於你的合影。<br>
        照片只在此裝置上合成，不會上傳。
      </p>
      <button class="btn btn--primary" id="btnStart">開始拍照</button>
      <p class="panel__note">按下後瀏覽器會詢問相機權限</p>
    </div>
  </section>

  <section class="screen" id="screenResult">
    <div class="result">
      <div class="result__frame"><img id="resultImg" alt="拍攝結果"></div>
      <p class="result__hint" id="resultHint"></p>
      <div class="result__actions">
        <button class="btn btn--ghost" id="btnRetake">重新拍攝</button>
        <button class="btn btn--primary" id="btnSave">儲存照片</button>
      </div>
    </div>
  </section>

  <section class="screen" id="screenError">
    <div class="panel">
      <h2 class="panel__title panel__title--sm" id="errorTitle">無法啟動相機</h2>
      <p class="panel__desc" id="errorMsg"></p>
      <button class="btn btn--primary" id="btnRetry">重新嘗試</button>
    </div>
  </section>

</div>

</body>
</html>
